<polyline points="450.0,260.0 450.0,300.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="450.0,300.0 455.5,289.0 444.5,289.0" fill="#3e4c59"/>
<rect x="453.1" y="273.5" width="29.8" height="17" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="468.0" y="286.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#3e4c59" font-style="italic">yes</text>
<polyline points="600.0,350.0 700.0,350.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="700.0,350.0 689.0,344.5 689.0,355.5" fill="#3e4c59"/>
<rect x="635.1" y="331.5" width="29.8" height="17" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="650.0" y="344.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#3e4c59" font-style="italic">yes</text>
<polyline points="450.0,400.0 450.0,440.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="450.0,440.0 455.5,429.0 444.5,429.0" fill="#3e4c59"/>
<rect x="454.4" y="413.5" width="23.2" height="17" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="466.0" y="426.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#3e4c59" font-style="italic">no</text>
<polyline points="600.0,490.0 700.0,490.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="700.0,490.0 689.0,484.5 689.0,495.5" fill="#3e4c59"/>
<rect x="635.1" y="471.5" width="29.8" height="17" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="650.0" y="484.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#3e4c59" font-style="italic">yes</text>
<polyline points="450.0,540.0 450.0,580.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="450.0,580.0 455.5,569.0 444.5,569.0" fill="#3e4c59"/>
<rect x="454.4" y="553.5" width="23.2" height="17" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="466.0" y="566.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#3e4c59" font-style="italic">no</text>
<polyline points="450.0,664.0 450.0,700.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="450.0,700.0 455.5,689.0 444.5,689.0" fill="#3e4c59"/>
<polyline points="600.0,750.0 700.0,750.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="700.0,750.0 689.0,744.5 689.0,755.5" fill="#3e4c59"/>
<rect x="638.4" y="731.5" width="23.2" height="17" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="650.0" y="744.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#3e4c59" font-style="italic">no</text>
<polyline points="450.0,800.0 450.0,840.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="450.0,840.0 455.5,829.0 444.5,829.0" fill="#3e4c59"/>
<rect x="453.1" y="813.5" width="29.8" height="17" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="468.0" y="826.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#3e4c59" font-style="italic">yes</text>
<polyline points="450.0,916.0 450.0,950.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="450.0,950.0 455.5,939.0 444.5,939.0" fill="#3e4c59"/>
<polyline points="1030.0,490.0 1065.0,490.0 1065.0,878.0 600.0,878.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="600.0,878.0 611.0,883.5 611.0,872.5" fill="#3e4c59"/>
<rect x="791.2" y="859.5" width="82.6" height="17" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="832.5" y="872.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#3e4c59" font-style="italic">valid table</text>
<rect x="30.0" y="560.0" width="230.0" height="150.0" rx="6.0" fill="#f1f1f1" stroke="#7b8794" stroke-width="1.6"/>
<text x="145.0" y="607.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2933">Why best fit?</text>
<text x="145.0" y="623.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Giving a party of 2 the</text>
<text x="145.0" y="639.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">smallest suitable table keeps</text>
<text x="145.0" y="655.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">large tables free for large</text>
<text x="145.0" y="671.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">parties.</text>
</svg>