<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1080" viewBox="0 0 1100 1080" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="38.0" font-size="20" font-weight="bold" text-anchor="start" fill="#1f2933">Flowchart 1 - Booking a reservation (Module 2 + Module 4)</text>
<rect x="340.0" y="70.0" width="220.0" height="46.0" rx="23.0" fill="#e6f4ea" stroke="#3d8b55" stroke-width="1.6"/>
<text x="450.0" y="97.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2933">Host fills the form and clicks Book</text>
<polygon points="450.0,150.0 600.0,205.0 450.0,260.0 300.0,205.0" fill="#fff8e1" stroke="#b7891c" stroke-width="1.6"/>
<text x="450.0" y="193.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Valid name, phone,</text>
<text x="450.0" y="209.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">party size 1-20, time in</text>
<text x="450.0" y="225.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">service hours on a 15-min slot?</text>
<polygon points="450.0,300.0 600.0,350.0 450.0,400.0 300.0,350.0" fill="#fff8e1" stroke="#b7891c" stroke-width="1.6"/>
<text x="450.0" y="346.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Guest already booked</text>
<text x="450.0" y="362.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">within 90 min?</text>
<polygon points="450.0,440.0 600.0,490.0 450.0,540.0 300.0,490.0" fill="#fff8e1" stroke="#b7891c" stroke-width="1.6"/>
<text x="450.0" y="486.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Host picked a</text>
<text x="450.0" y="502.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">specific table?</text>
<rect x="300.0" y="580.0" width="300.0" height="84.0" rx="6.0" fill="#ffffff" stroke="#3e4c59" stroke-width="1.6"/>
<text x="450.0" y="610.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Best fit: smallest table that fits,</text>
<text x="450.0" y="626.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">preferred section first, free for</text>
<text x="450.0" y="642.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">the whole 90-min window</text>
<polygon points="450.0,700.0 600.0,750.0 450.0,800.0 300.0,750.0" fill="#fff8e1" stroke="#b7891c" stroke-width="1.6"/>
<text x="450.0" y="754.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2933">Table found?</text>
<rect x="300.0" y="840.0" width="300.0" height="76.0" rx="6.0" fill="#ffffff" stroke="#3e4c59" stroke-width="1.6"/>
<text x="450.0" y="874.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Save: ArrayList + HashMap (by ID)</text>
<text x="450.0" y="890.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">+ TreeMap (by time)</text>
<rect x="300.0" y="950.0" width="300.0" height="84.0" rx="6.0" fill="#ffffff" stroke="#3e4c59" stroke-width="1.6"/>
<text x="450.0" y="988.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Starts within 30 min? -&gt; hold table</text>
<text x="450.0" y="1004.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">(RESERVED) and alert host</text>
<rect x="700.0" y="175.0" width="330.0" height="60.0" rx="6.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="865.0" y="201.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Show validation error</text>
<text x="865.0" y="217.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">(InvalidReservationException)</text>
<rect x="700.0" y="320.0" width="330.0" height="60.0" rx="6.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="865.0" y="354.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Show 'already has reservation...'</text>
<rect x="700.0" y="452.0" width="330.0" height="76.0" rx="6.0" fill="#ffffff" stroke="#3e4c59" stroke-width="1.6"/>
<text x="865.0" y="478.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Table fits the party and has no</text>
<text x="865.0" y="494.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">overlapping booking? else show</text>
<text x="865.0" y="510.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">TableNotAvailableException</text>
<rect x="700.0" y="720.0" width="330.0" height="60.0" rx="6.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="865.0" y="746.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">Show 'no table free around ...'</text>
<text x="865.0" y="762.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2933">(TableNotAvailableException)</text>
<polyline points="450.0,116.0 450.0,150.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="450.0,150.0 455.5,139.0 444.5,139.0" fill="#3e4c59"/>
<polyline points="600.0,205.0 700.0,205.0" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<polygon points="700.0,205.0 689.0,199.5 689.0,210.5" fill="#3e4c59"/>
<rect x="638.4" y="186.5" width="23.2" height="17" rx="3" fill="#ffffff" opacity="0.92"/>
